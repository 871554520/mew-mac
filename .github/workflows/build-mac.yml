name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 生成 .icns
        run: |
          set -e
          mkdir -p build/AppIcon.iconset
          SRC="Mewgenics.app/Contents/Resources/AppIcon-256.png"
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out "build/AppIcon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) "$SRC" --out "build/AppIcon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/AppIcon.iconset -o Mewgenics.app/Contents/Resources/AppIcon.icns

      - name: 权限与临时签名
        run: |
          chmod +x Mewgenics.app/Contents/MacOS/Mewgenics
          xattr -cr Mewgenics.app || true
          codesign --force --deep --sign - Mewgenics.app
          codesign -dv Mewgenics.app 2>&1 | head -5

      - name: 打包
        run: |
          ditto -c -k --sequesterRsrc --keepParent Mewgenics.app Mewgenics-mac.zip
          ls -l Mewgenics-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mewgenics-mac
          path: Mewgenics-mac.zip
          if-no-files-found: error
